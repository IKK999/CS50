{% extends "encyclopedia/layout.html" %}

{% block title %}
    Edit Entry {{ title }}
{% endblock %}

{% block body %}
    <h1>Edit Entry {{ title }}</h1>

    <form action="{% url 'edit' title=title %}" method="post">
        {% csrf_token %}
        <p>Title:</p>
        <p>{{ title }}</p>
        {{ content }}
        <br>
        <input type="submit">
    </form>
{% endblock %}
